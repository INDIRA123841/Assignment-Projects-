<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>JS-form</title>
</head>
<body class="bg-teal-200 ">
   <div>
      <form onsubmit="addNew(event)"
         class="p-10 py-6 max-[40rem]:p-5 border border-blue-200 rounded-md mx-auto mt-10 w-[550px] max-w-[calc(100%-40px)] flex flex-col space-y-4 bg-[#d0ffff] shadow-md">
         <h1 class="text-center font-bold text-[1.3rem] text-teal-950 mb-4 max-[40rem]:text-[1rem]">ADD MEMBER</h1>
         <div class="flex flex-col gap-1">
            <label for="name" class="font-bold text-teal-800 text-[1rem] max-[40rem]:text-[0.8rem]">Name</label>
            <input 
            type="text" 
            id="name"
            name="name"
            placeholder="Enter Name"
            class="px-2 border border-[#7ac6cd] rounded-sm h-10  max-[40rem]:h-8 shadow-sm placeholder:text-gray-500 outline-none focus:border-gray-400 focus:shadow-sm focus:shadow-gray-300 focus:translate-y-1 transition-all duration-300" 
            />
         </div>

         <div class="flex flex-col gap-1">
            <label for="email" class="font-bold  text-teal-800 text-[1rem] max-[40rem]:text-[0.8rem]">Email</label>
            <input 
            type="text" 
            id="email"
            name="email"
            placeholder="Enter email"
            class="px-2 border border-[#7ac6cd] rounded-sm h-10 max-[40rem]:h-8 shadow-sm placeholder:text-gray-500 outline-none focus:border-gray-400 focus:shadow-sm focus:shadow-gray-300 focus:translate-y-1 transition-all duration-300"
            />
         </div>

         

         <button type="submit"
            class="bg-teal-900 text-gray-200 font-bold h-10 max-[40rem]:h-8 rounded-sm mt-3 hover:bg-teal-600 cursor-pointer hover:translate-y-2  hover:shadow-md  transition-all duration-200">
            Add+
         </button>
      </form>


      <section class="mt-7  rounded-md border border-gray-300 shadow-sm w-[550px] mx-auto max-w-[calc(100%-40px)] p-10 py-5 max-[40rem]:p-5">
         <h1 class="font-bold text-[1.5rem] text-emerald-900 text-center max-[40rem]:text-[1rem]">Members List</h1>

         <div class="space-y-4 " id="renders">
            <!--  render the members' list here  -->
         </div>
         
      </section>
      
   </div> 


   <script src="form.js"></script>
</body>
</html>
