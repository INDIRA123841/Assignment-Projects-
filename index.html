<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Document</title>
    <style>
        #card{
            animation: drop 1s ease-out forwards;
            transition: all;
        }
        @keyframes drop{
            0%{
                transform: translateY(-100vh);
                opacity: 0;
            }
            100%{
                transform: translateY(0px);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient-to-b from-blue-300 to-blue-600 h-[100vh]">
        <div class="flex justify-evenly gap-5 ">
            <div class="mt-20 bg-[rgba(240,247,245,0.91)] p-10 rounded-md flex flex-col items-center w-[400px]">
                <h1 class="text-slate-600 font-bold text-[1.3rem] mb-3">USER PROFILE</h1>
                
                <form class="w-full">
                    <div class="flex flex-col gap-6">
                        <div class="flex flex-col gap-[2px] ">
                            <label for="name" class="font-semibold text-gray-800 font-serif">Name:</label>
                            <input type="text" placeholder="Enter name" id="name" name="name" class="border border-gray-500 p-2 rounded-sm focus:outline focus:outline-none focus:shadow-sm shadow-blue-400 focus:border-blue-300 transition-all duration-300 focus:translate-y-2" />
                        </div>

                        <div class="flex flex-col gap-[2px]">
                            <label for="email" class=" font-semibold text-gray-800 font-serif">Email ID:</label>
                            <input type="text" placeholder="Enter email" id="email" name="email" class="border border-gray-500 p-2 rounded-sm focus:outline focus:outline-none focus:shadow-sm shadow-blue-400 focus:border-blue-300 transition-all duration-300 focus:translate-y-2"  />
                        </div>

                        <div class="flex flex-col gap-[2px]">
                            <label for="profession" class=" font-semibold text-gray-800 font-serif">Profession:</label>
                            <input type="text" placeholder="Enter profession" id="profession" name="profession" class="border border-gray-500 p-2 rounded-sm focus:outline focus:outline-none focus:shadow-sm shadow-blue-400 focus:border-blue-300 transition-all duration-300 focus:translate-y-2"/>
                        </div>

                        <div class="flex flex-col gap-[2px]">
                            <label for="address" class=" font-semibold text-gray-800 font-serif">Address:</label>
                            <input type="text" placeholder="Enter address" id="address" name="address" class="border border-gray-500 p-2 rounded-sm focus:outline focus:outline-none focus:shadow-sm shadow-blue-400 focus:border-blue-300 transition-all duration-300 focus:translate-y-2"/>
                        </div>

                        <button type="button"
                          class="mt-3 bg-[#020234] text-gray-200 p-2 rounded-md font-bold cursor-pointer hover:bg-green-800 transition-all hover:translate-y-1"
                          onclick="cardDisplay()">
                          Search
                        </button>
                    </div>
                </form>
                
            </div>

            <!-- Card -->
            <div id="card" class="mt-20  bg-gradient-to-r from-[#e0f7f3] to-[#12f4d6] border-2 border-teal-300 rounded-md p-10 py-5 w-[400px] hidden"> 
                <!-- <div class="flex gap-1 items-center">
                    <img src="user.png" alt="user" class="w-7">
                    <h1 class="font-bold text-[1.2rem] text-gray-600">Profile</h1>
                </div> -->
                
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
